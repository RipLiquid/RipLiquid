name: Daily quote

on:
  schedule:
    - cron: '0 0 * * *'
      timezone: America/Toronto
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-quote.yml'
      - 'scripts/update_quote.py'
      - 'quotes.json'

permissions:
  contents: write

concurrency:
  group: daily-profile-quote
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Update quote
        run: python3 scripts/update_quote.py
      - name: Save updated quote
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Refresh daily quote'
          git push origin HEAD:main
